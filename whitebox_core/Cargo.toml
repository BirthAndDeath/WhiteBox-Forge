[package]
name = "whitebox_core"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["lib"]
[dependencies]
anyhow = "1.0.104"
postcard = { version = "1.1", features = ["use-std"] }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros"] }
# 关闭默认特性以剔除 `cache`（其 zstd 依赖有未修复 advisory；且我们尚未启用编译缓存）。
# 其余与 wasmtime 49 默认特性集一致（defaults minus cache）。
wasmtime = { version = "49.0.2", default-features = false, features = [
    "anyhow", "async", "backtrace", "gc", "gc-copying", "gc-drc", "gc-null",
    "wat", "profiling", "parallel-compilation", "cranelift", "pooling-allocator",
    "demangle", "addr2line", "coredump", "debug-builtins", "runtime",
    "component-model", "component-model-async", "threads", "stack-switching",
    "std", "debug", "compile-time-builtins", "wit-parser",
] }
wasmtime-wasi = { version = "49.0.2", default-features = false, features = ["p2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt"] }
