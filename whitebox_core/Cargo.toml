[package]
name = "whitebox_core"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["lib"]

# `portable`：把所有自身目录放到可执行文件所在目录下，不写 OS 用户目录。
# `portable`: keep all app-owned directories beside the executable, not in OS user dirs.
[features]
portable = []

[dependencies]
anyhow = "1.0.104"
postcard = { version = "1.1", features = ["use-std"] }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["macros"] }
wasmtime = { version = "50.0.1", features = ["cache"] }
wasmtime-wasi = "49.0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt"] }
