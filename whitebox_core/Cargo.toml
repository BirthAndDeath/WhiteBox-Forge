[package]
name = "whitebox_core"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["lib"]
[dependencies]
anyhow = "1.0.104"
bincode = "1.3"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
wasmtime = { version = "47.0.3", features = ["cache"] }
wasmtime-wasi = "47.0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
