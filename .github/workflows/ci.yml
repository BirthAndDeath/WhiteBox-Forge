name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: install cargo-audit
        run: cargo install cargo-audit --locked

      - name: audit
        # 若出现仅存在于 dev/工具链中的已知 advisory，在此按 `--ignore RUSTSEC-xxxx` 说明依据（OpenWire 同款做法）
        run: cargo audit

  cargo-check-clippy:
    name: cargo check (gate) + clippy (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: "cargo check (hard gate: 仅编译错误才终止)"
        # 排除 whitebox-forge（Slint GUI crate，ubuntu runner 缺 fontconfig 等系统库）
        run: cargo check -p whitebox_core --all-targets --all-features

      - name: "cargo clippy (advisory: 只警告，不终止)"
        # 故意不加 `-D warnings`：clippy 意见仅供参考，不阻断构建
        run: cargo clippy -p whitebox_core --all-targets

  cargo-test:
    name: cargo test (whitebox_core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (core)
        # 排除 whitebox-forge（Slint GUI crate，ubuntu runner 上无图形系统依赖）。
        # tee 落盘完整日志 + 上传 artifact，便于定位（pipefail 保证失败不被管道吞掉）。
        run: |
          set -o pipefail
          rustc --version
          cargo --version
          cargo test -p whitebox_core --all-features --verbose 2>&1 | tee test-core.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whitebox_core-test-log
          path: test-core.log