[workspace]
members = ["whitebox_core"]
resolver = "3"

[package]
name = "whitebox-forge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
slint = "1.18.1"

whitebox_core = { path = "whitebox_core" }

# `directories` 仅用于桌面平台（与 whitebox_core 保持一致）。
# `directories` is desktop-only (kept in sync with whitebox_core).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
directories = "6.0.0"

# 透传便携构建：`cargo build --features portable` 让 whitebox_core 也走便携目录。
# Passthrough portable build: `cargo build --features portable` enables it in whitebox_core.
[features]
portable = ["whitebox_core/portable"]

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1"
[profile.dev]
incremental = true
lto = false
