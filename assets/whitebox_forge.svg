<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect x="24" y="24" width="208" height="208" rx="56" fill="#ffffff" stroke="#1a2a3a" stroke-width="3"/>
  <g transform="translate(128, 100)" fill="none" stroke="#1a2a3a" stroke-width="3"
     stroke-linejoin="round" stroke-linecap="round">
    <!-- 立方体外轮廓：六边形带圆角 -->
    <path d="
      M 8.66,-31
      L 53.69,-5
      Q 62.35,0 62.35,10
      L 62.35,62
      Q 62.35,72 53.69,77
      L 8.66,103
      Q 0,108 -8.66,103
      L -53.69,77
      Q -62.35,72 -62.35,62
      L -62.35,10
      Q -62.35,0 -53.69,-5
      L -8.66,-31
      Q 0,-36 8.66,-31
      Z
    "/>
    <!-- 顶面内部边：端点移到圆角弧线处 -->
    <line x1="60" y1="1" x2="0" y2="36"/>
    <line x1="-60" y1="1" x2="0" y2="36"/>
    <!-- 中央棱线：底部端点移到圆角弧线处 -->
    <line x1="0" y1="36" x2="0" y2="105"/>
  </g>
  <text x="128" y="180" text-anchor="middle"
        font-family="'Inter', 'Segoe UI', system-ui, sans-serif"
        font-weight="800" font-size="34" letter-spacing="-1"
        fill="#1a2a3a">WhiteBox</text>
</svg>
